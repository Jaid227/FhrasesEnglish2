s.","aim yast lúking thánks","Solo estoy viendo, gracias.","Compras y comida"],["This is delicious.","dhis is dilíshas","Esto está delicioso.","Compras y comida"],["I'd like some tea.","aid láik sam tí","Quisiera un poco de té.","Compras y comida"],["Where is the bathroom?","uér is dha báthrum","¿Dónde está el baño?","Viajes"],["Is it far from here?","is it far from jíer","¿Está lejos de aquí?","Viajes"],["Turn left at the corner.","tern left at dha kórner","Da vuelta a la izquierda en la esquina.","Viajes"],["Go straight ahead.","góu stréit ajéd","Sigue derecho.","Viajes"],["I need a ticket.","ai níd a tíkit","Necesito un boleto.","Viajes"],["I'm looking for the station.","aim lúking for dha stéishon","Estoy buscando la estación.","Viajes"],["I like this song.","ai láik dhis song","Me gusta esta canción.","Conversación"],["What do you do?","uát du iu dú","¿A qué te dedicas?","Conversación"],["I work from home.","ai uérk from jóum","Trabajo desde casa.","Conversación"],["I study English every day.","ai stádi ínglish évri déi","Estudio inglés todos los días.","Conversación"],["Do you have any questions?","du iu jav éni kuéschons","¿Tienes alguna pregunta?","Conversación"],["Let's try again.","lets trái aguén","Intentémoslo de nuevo.","Conversación"]],[["I've been learning English for a year.","aiv bin lérning ínglish for a yíer","Llevo un año aprendiendo inglés.","Conversación","Present perfect continuous: have been + verbo-ing. For indica duración; since indica el punto de inicio."],["What do you usually do on weekends?","uát du iu iúshuali dú on uíkends","¿Qué sueles hacer los fines de semana?","Conversación"],["I used to live near the beach.","ai iúst tu liv níer dha bích","Antes vivía cerca de la playa.","Conversación","Used to + verbo describe hábitos o situaciones pasadas que ya cambiaron."],["I'm getting used to the weather.","aim guéting iúst tu dha uédher","Me estoy acostumbrando al clima.","Conversación","Get used to + sustantivo o verbo-ing significa acostumbrarse. No es lo mismo que used to + verbo."],["That sounds like a great idea.","dhat sáunds láik a gréit aidía","Eso suena como una gran idea.","Conversación"],["I haven't seen you in ages.","ai jávant sín iu in éiyis","Hace muchísimo que no te veo.","Conversación"],["How was your weekend?","jáu uaz ior uíkend","¿Cómo estuvo tu fin de semana?","Conversación"],["What are you planning to do?","uát ar iu pláning tu dú","¿Qué estás planeando hacer?","Conversación"],["Would you mind opening the window?","wud iu máind óupening dha uíndou","¿Te molestaría abrir la ventana?","Vida diaria","Después de Would you mind usa verbo-ing. No, not at all significa que no te molesta."],["I'll call you as soon as I arrive.","ail kól iu as sún as ai arráiv","Te llamaré en cuanto llegue.","Vida diaria","Tras as soon as, usa presente para una referencia futura: as soon as I arrive, no as soon as I will arrive."],["I'm running a little late.","aim ráning a lítol léit","Voy un poco tarde.","Vida diaria"],["It takes me twenty minutes to get there.","it téiks mi tuénti mínits tu guet dhér","Me toma veinte minutos llegar allí.","Vida diaria"],["I forgot to bring my keys.","ai forgát tu bring mai kís","Olvidé traer mis llaves.","Vida diaria"],["You should get some rest.","iu shud guet sam rest","Deberías descansar un poco.","Vida diaria","Should + verbo base da consejos. No se agrega to después de should."],["I've already finished my homework.","aiv olrédi fínisht mai jóumuerk","Ya terminé mi tarea.","Vida diaria"],["I haven't decided yet.","ai jávant disáidid iet","Todavía no he decidido.","Vida diaria"],["Could I try this on?","kud ai trái dhis on","¿Podría probarme esto?","Compras y comida","Try on significa probarse ropa. Con pronombre: try it on, no try on it."],["Do you have this in a different size?","du iu jav dhis in a díferent sáis","¿Tienen esto en otra talla?","Compras y comida"],["I'd rather eat at home tonight.","aid rádher ít at jóum tunáit","Preferiría comer en casa esta noche.","Compras y comida","Would rather + verbo base expresa preferencia: I'd rather eat. No lleva to."],["Could we have a table for two?","kud ui jav a téibol for tú","¿Podrían darnos una mesa para dos?","Compras y comida"],["I'm allergic to peanuts.","aim aléryik tu pínats","Soy alérgico o alérgica al cacahuate.","Compras y comida"],["Could you recommend a local dish?","kud iu rekoménd a lóukal dish","¿Podrías recomendarme un platillo local?","Compras y comida"],["I'd like to book a room for two nights.","aid láik tu buk a rum for tú náits","Quisiera reservar una habitación por dos noches.","Viajes"],["Does the price include breakfast?","daz dha práis inklúd brékfast","¿El precio incluye desayuno?","Viajes"],["Could you tell me how to get there?","kud iu tel mi jáu tu guet dhér","¿Podrías decirme cómo llegar allí?","Viajes"],["My flight has been delayed.","mai fláit jaz bin diléid","Mi vuelo se ha retrasado.","Viajes","Has been + participio forma una pasiva en present perfect: importa el efecto actual del retraso."],["I think we took the wrong bus.","ai think ui tuk dha rong bas","Creo que tomamos el autobús equivocado.","Viajes"],["Is there a pharmacy nearby?","is dhér a fármasi níerbai","¿Hay una farmacia cerca?","Viajes"],["Could you send me the details by email?","kud iu send mi dha ditéils bai ímeil","¿Podrías enviarme los detalles por correo electrónico?","Trabajo"],["I'm in charge of this project.","aim in chárch ov dhis práyekt","Estoy a cargo de este proyecto.","Trabajo"],["Let's schedule a meeting for Monday.","lets skéyul a míting for mándei","Programemos una reunión para el lunes.","Trabajo"],["I need more time to finish this.","ai níd mor táim tu fínish dhis","Necesito más tiempo para terminar esto.","Trabajo"],["Could you explain what you mean?","kud iu ikspléin uát iu mín","¿Podrías explicar a qué te refieres?","Trabajo"],["I'll get back to you tomorrow.","ail guet bak tu iu tumórou","Te responderé mañana.","Trabajo","Get back to someone significa volver a contactar a alguien con una respuesta."],["If it rains, we'll stay at home.","if it réins uil stéi at jóum","Si llueve, nos quedaremos en casa.","Opiniones","Primer condicional: if + presente, will + verbo. Se usa para posibilidades futuras reales."],["I agree with you to some extent.","ai agrí uidh iu tu sam ikstént","Estoy de acuerdo contigo hasta cierto punto.","Opiniones"],["In my opinion, it's worth trying.","in mai opínion its uérth tráying","En mi opinión, vale la pena intentarlo.","Opiniones","Worth se construye con sustantivo o verbo-ing: worth trying, no worth to try."],["It depends on the situation.","it dipénds on dha sichu éishon","Depende de la situación.","Opiniones"],["I'm not sure that's a good idea.","aim nat shur dhats a gud aidía","No estoy seguro o segura de que sea buena idea.","Opiniones"],["The more you practice, the easier it gets.","dha mor iu práktis dhi ísier it guets","Cuanto más practicas, más fácil se vuelve.","Opiniones","The + comparativo, the + comparativo relaciona dos cambios: the more, the easier."]],[["If I were you, I'd take the opportunity.","if ai uer iu aid téik dhi aportúniti","Si yo fuera tú, aprovecharía la oportunidad.","Decisiones","Segundo condicional: if + pasado, would + verbo. If I were you es una fórmula habitual para aconsejar."],["I wish I had more time to travel.","ai uish ai jad mor táim tu trável","Ojalá tuviera más tiempo para viajar.","Decisiones","Wish + pasado expresa un deseo sobre una situación presente que querrías cambiar."],["I'd have called you if I'd known.","aid jav kóld iu if aid nóun","Te habría llamado si lo hubiera sabido.","Decisiones","Tercer condicional: would have + participio / if + had + participio. Imagina otro pasado."],["We might have overlooked a few details.","ui máit jav óuverlukt a fiu ditéils","Puede que hayamos pasado por alto algunos detalles.","Decisiones","Might have + participio expresa posibilidad sobre el pasado."],["You don't have to decide right away.","iu dóunt jav tu disáid ráit auéi","No tienes que decidir de inmediato.","Decisiones","Don't have to significa falta de obligación. Mustn't significa prohibición."],["I'd rather you didn't mention it.","aid rádher iu dídant ménshon it","Preferiría que no lo mencionaras.","Decisiones","Would rather + otra persona + pasado expresa una preferencia sobre lo que esa persona haga ahora o después."],["It's about time we took action.","its abáut táim ui tuk ákshon","Ya es hora de que tomemos medidas.","Decisiones"],["There's no point in worrying about it now.","dhérs nou póint in uóring abáut it náu","No tiene caso preocuparse por eso ahora.","Decisiones","There's no point in + verbo-ing expresa que hacer algo no resulta útil."],["Despite the difficulties, we kept going.","dispáit dha dífikaltis ui kept góuing","A pesar de las dificultades, seguimos adelante.","Opiniones","Despite va con sustantivo o verbo-ing. Aunque + oración suele traducirse con although."],["As far as I know, the plan hasn't changed.","as far as ai nóu dha plan jázant chéinyd","Hasta donde sé, el plan no ha cambiado.","Opiniones"],["That being said, we should consider other options.","dhat bíing sed ui shud konsíder ádher ópshons","Dicho esto, deberíamos considerar otras opciones.","Opiniones"],["I see your point, but I have some concerns.","ai sí ior póint bat ai jav sam konsérns","Entiendo tu argumento, pero tengo algunas inquietudes.","Opiniones"],["What matters most is how we respond.","uát máters móust is jáu ui rispánd","Lo más importante es cómo respondemos.","Opiniones"],["To be honest, I hadn't thought of that.","tu bi ánist ai jádant thot ov dhat","Para ser sincero o sincera, no había pensado en eso.","Opiniones"],["It's not as straightforward as it seems.","its nat as stréitfóruerd as it síms","No es tan sencillo como parece.","Opiniones"],["I'm inclined to agree with that approach.","aim inkláind tu agrí uidh dhat apróuch","Me inclino por estar de acuerdo con ese enfoque.","Opiniones"],["We need to come up with a better solution.","ui níd tu kam ap uidh a béter solúshon","Necesitamos idear una mejor solución.","Trabajo","Come up with significa idear o proponer algo. Aprende la expresión completa."],["Let's make sure we're on the same page.","lets méik shur uir on dha séim péiych","Asegurémonos de que estamos en sintonía.","Trabajo","Be on the same page es estar de acuerdo o tener la misma comprensión de un asunto."],["I'll look into it and keep you posted.","ail luk íntu it and kíp iu póustid","Lo investigaré y te mantendré al tanto.","Trabajo"],["We can't afford to miss this deadline.","ui kant afórd tu mis dhis dédlain","No podemos permitirnos incumplir este plazo.","Trabajo"],["I'd appreciate it if you could clarify that.","aid apríshieit it if iu kud klérifai dhat","Te agradecería que pudieras aclarar eso.","Trabajo"],["The proposal is still under discussion.","dha propóusal is stil ánder diskáshon","La propuesta sigue en discusión.","Trabajo"],["We should take their feedback into account.","ui shud téik dhér fídbak íntu akáunt","Deberíamos tomar en cuenta sus comentarios.","Trabajo"],["The meeting has been put off until Friday.","dha míting jaz bin put of antíl fráidei","La reunión se ha pospuesto hasta el viernes.","Trabajo","Put off significa posponer. Has been put off está en voz pasiva."],["I ended up staying longer than expected.","ai éndid ap stéying lónguer dhan ikspéktid","Terminé quedándome más de lo esperado.","Experiencias","End up + verbo-ing describe cómo terminó una situación, a menudo de manera inesperada."],["It turned out to be a blessing in disguise.","it ternd áut tu bi a blésing in disguáis","Resultó ser algo bueno que al principio parecía malo.","Experiencias","A blessing in disguise describe un beneficio que inicialmente parecía una desgracia."],["I've been meaning to ask you something.","aiv bin míning tu ask iu sámthing","Llevo tiempo queriendo preguntarte algo.","Experiencias"],["I can't help wondering what happened.","ai kant jelp uóndering uát jápend","No puedo evitar preguntarme qué pasó.","Experiencias","Can't help + verbo-ing significa no poder evitar hacer algo."],["It took me a while to get the hang of it.","it tuk mi a uáil tu guet dha jang ov it","Me tomó un tiempo agarrarle la onda.","Experiencias"],["Looking back, I would have done things differently.","lúking bak ai wud jav dan things díferentli","Mirando atrás, habría hecho las cosas de otra manera.","Experiencias"],["I had my phone repaired yesterday.","ai jad mai fóun ripérd iésterdei","Ayer mandé reparar mi teléfono.","Experiencias","Have + objeto + participio indica que alguien hace un servicio por ti; no que tú lo realizaste."],["By the time we arrived, they had already left.","bai dha táim ui arráivd dhei jad olrédi left","Para cuando llegamos, ya se habían ido.","Experiencias","Past perfect (had left) sitúa una acción antes de otra acción pasada (arrived)."],["You must have been exhausted.","iu mast jav bin igsóstid","Debiste de haber estado agotado o agotada.","Relaciones","Must have + participio expresa una deducción sobre el pasado, no una obligación."],["I didn't mean to hurt your feelings.","ai dídant mín tu jert ior fílings","No quise herir tus sentimientos.","Relaciones"],["Let's not jump to conclusions.","lets nat yamp tu konklúshons","No saquemos conclusiones precipitadas.","Relaciones"],["I understand where you're coming from.","ai anderstánd uér ior káming from","Entiendo tu punto de vista.","Relaciones","Aquí where you're coming from se refiere a la perspectiva de una persona, no a su lugar de origen."],["I should have listened more carefully.","ai shud jav lísend mor kérfuli","Debí haber escuchado con más atención.","Relaciones"],["Feel free to disagree with me.","fíl fri tu disag rí uidh mi","Siéntete libre de estar en desacuerdo conmigo.","Relaciones"],["I'd like to make it up to you.","aid láik tu méik it ap tu iu","Me gustaría compensarte por lo ocurrido.","Relaciones"],["We don't always see eye to eye.","ui dóunt ólueis sí ái tu ái","No siempre estamos de acuerdo.","Relaciones","See eye to eye significa coincidir en una opinión, no mirarse literalmente a los ojos."]],[["Had I known earlier, I would have acted differently.","jad ai nóun érlier ai wud jav áktid díferentli","Si lo hubiera sabido antes, habría actuado de otra manera.","Matices","Inversión del tercer condicional: Had I known equivale a If I had known. Es más formal."],["Were it not for your support, we would struggle.","uer it nat for ior sapórt ui wud strágol","Si no fuera por tu apoyo, tendríamos dificultades.","Matices","Were it not for equivale a If it were not for. La inversión da un registro formal."],["Not only did she apologize, but she also offered to help.","nat óunli did shi apóloyaiz bat shi ólsou óferd tu jelp","No solo se disculpó, sino que también se ofreció a ayudar.","Matices","Al comenzar con Not only se invierten auxiliar y sujeto: did she apologize."],["Under no circumstances should you share that information.","ánder nou sérkamstansis shud iu sher dhat informéishon","Bajo ninguna circunstancia deberías compartir esa información.","Matices","Una expresión negativa al inicio puede exigir inversión: should you, no you should."],["No sooner had we started than the power went out.","nou súner jad ui stártid dhan dha páuer uent áut","Apenas habíamos comenzado cuando se fue la luz.","Matices","No sooner had + sujeto + participio se combina con than para dos sucesos casi inmediatos."],["Little did I know how much things would change.","lítol did ai nóu jáu mach things wud chéinych","Poco imaginaba cuánto cambiarían las cosas.","Matices"],["What I find remarkable is their resilience.","uát ai fáind rimárkabol is dhér rizílians","Lo que me parece notable es su capacidad de sobreponerse.","Matices"],["It was her persistence that made the difference.","it uaz jer persístans dhat méid dha díferens","Fue su perseverancia lo que marcó la diferencia.","Matices","It was X that… es una estructura enfática: destaca el elemento X."],["The evidence calls that assumption into question.","dhi évidens kols dhat asámpshon íntu kuéschon","La evidencia pone en duda esa suposición.","Argumentación"],["That argument doesn't hold up under scrutiny.","dhat árguiment dázant jóuld ap ánder skrútini","Ese argumento no resiste un examen minucioso.","Argumentación"],["The findings should be interpreted with caution.","dha fáindings shud bi intérpritid uidh kóshon","Los hallazgos deben interpretarse con cautela.","Argumentación"],["Correlation does not necessarily imply causation.","koraléishon daz nat nesasérili implái kozéishon","La correlación no implica necesariamente causalidad.","Argumentación","Not necessarily limita la afirmación. No significa que nunca exista una relación causal."],["There is a fine line between confidence and arrogance.","dhér is a fáin láin bituín kánfidens and árogans","Hay una línea muy delgada entre la confianza y la arrogancia.","Argumentación"],["This raises broader questions about accountability.","dhis réizis bróder kuéschons abáut akauntabíliti","Esto plantea preguntas más amplias sobre la rendición de cuentas.","Argumentación"],["The extent to which this applies remains unclear.","dhi ikstént tu uích dhis apláis riméins anklíer","Sigue sin estar claro hasta qué punto se aplica esto.","Argumentación"],["We should avoid drawing sweeping conclusions.","ui shud avóid dróing suíping konklúshons","Deberíamos evitar sacar conclusiones demasiado generales.","Argumentación"],["We need to strike a balance between speed and quality.","ui níd tu stráik a bálans bituín spíd and kuóliti","Necesitamos encontrar un equilibrio entre rapidez y calidad.","Negociación"],["I'm willing to compromise, provided that we agree on the essentials.","aim uíling tu kómpromaiz prováidid dhat ui agrí on dhi isénshals","Estoy dispuesto o dispuesta a ceder, siempre que acordemos lo esencial.","Negociación","Provided that significa siempre que. Compromise aquí es llegar a un acuerdo mediante concesiones."],["Let's address the elephant in the room.","lets adrés dhi élefant in dha rum","Hablemos del problema evidente que estamos evitando.","Negociación","The elephant in the room es un asunto evidente e incómodo que nadie quiere mencionar."],["We shouldn't lose sight of the bigger picture.","ui shúdant luz sáit ov dha bíguer píkcher","No deberíamos perder de vista el panorama general.","Negociación"],["That's a trade-off we'll have to weigh carefully.","dhats a tréid of uil jav tu uéi kérfuli","Es una concesión que tendremos que sopesar con cuidado.","Negociación","Trade-off es un equilibrio en el que obtener una ventaja implica sacrificar otra."],["Let's establish common ground before moving forward.","lets estáblish kámon gráund bifór múving fóruerd","Establezcamos puntos de acuerdo antes de avanzar.","Negociación"],["I take your point, though I'd frame it differently.","ai téik ior póint dhou aid fréim it díferentli","Entiendo tu argumento, aunque lo plantearía de otra manera.","Negociación"],["We may need to revisit our initial assumptions.","ui méi níd tu rivízit áuer iníshal asámpshons","Quizá necesitemos revisar nuestras suposiciones iniciales.","Negociación"],["By next June, I'll have been working here for ten years.","bai nekst yun ail jav bin uérking jíer for ten yíers","Para el próximo junio, llevaré diez años trabajando aquí.","Estructuras","Future perfect continuous: will have been + verbo-ing. Mide duración hasta un momento futuro."],["The report is believed to have been leaked.","dha ripórt is bilívd tu jav bin líkt","Se cree que el informe fue filtrado.","Estructuras","Is believed to have been + participio permite informar una creencia sobre una acción pasada en pasiva."],["Having considered all the options, we chose to wait.","jáving konsíderd ol dhi ópshons ui chóus tu uéit","Tras considerar todas las opciones, decidimos esperar.","Estructuras","Having + participio indica una acción previa. El sujeto de ambas partes debe ser el mismo."],["Much as I'd like to help, I simply don't have the time.","mach as aid láik tu jelp ai símpli dóunt jav dha táim","Por mucho que quisiera ayudar, simplemente no tengo tiempo.","Estructuras","Much as introduce una concesión: aceptas una idea antes de plantear una limitación."],["Be that as it may, the deadline still stands.","bi dhat as it méi dha dédlain stil stands","Sea como sea, el plazo sigue vigente.","Estructuras"],["Should you need further assistance, please let us know.","shud iu níd férdher asístans plís let as nóu","Si necesitas más ayuda, por favor avísanos.","Estructuras","Should you need equivale a If you should need y es común en correspondencia formal."],["But for a few minor issues, the launch went smoothly.","bat for a fiu máiner íshus dha lonch uent smúdhli","Salvo por algunos problemas menores, el lanzamiento transcurrió sin contratiempos.","Estructuras"],["The sooner we act, the less damage there will be.","dha súner ui akt dha les dámech dhér uil bi","Cuanto antes actuemos, menos daño habrá.","Estructuras"],["I wouldn't put it past him to change his mind.","ai wúdant put it past jim tu chéinych jis máind","No me sorprendería que él cambiara de opinión.","Expresiones","I wouldn't put it past someone expresa que crees que esa persona sería capaz de hacer algo, generalmente cuestionable."],["You've hit the nail on the head.","iuv jit dha néil on dha jed","Has dado en el clavo.","Expresiones"],["That's easier said than done.","dhats ísier sed dhan dan","Eso es más fácil de decir que de hacer.","Expresiones"],["Let's cross that bridge when we come to it.","lets kros dhat brich uen ui kam tu it","Resolvamos ese problema cuando se presente.","Expresiones"],["It's a double-edged sword.","its a dábol edyd sord","Es un arma de doble filo.","Expresiones"],["I think we're getting ahead of ourselves.","ai think uir guéting ajéd ov auersélvs","Creo que nos estamos adelantando demasiado.","Expresiones"],["That was the last straw.","dhat uaz dha last stro","Eso fue la gota que derramó el vaso.","Expresiones"],["In hindsight, the warning signs were there all along.","in jáindsait dha uórning sáins uer dhér ol alóng","En retrospectiva, las señales de advertencia estuvieron ahí todo el tiempo.","Expresiones"]]];

const ICONS={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',book:'<path d="M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v15"/>',study:'<path d="m3 8 9-5 9 5-9 5-9-5Zm4 3v6c3 3 7 3 10 0v-6m4-3v8"/>',guide:'<circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4 4-2Z"/>',chart:'<path d="M4 3v17h17M8 16v-4m5 4V7m5 9v-6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>',moon:'<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/>',sound:'<path d="M11 4 6 8H3v8h3l5 4V4Zm4 4c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/>',mute:'<path d="M11 4 6 8H3v8h3l5 4V4Zm5 5 6 6m0-6-6 6"/>',play:'<path d="m9 5 10 7-10 7V5Z"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',star:'<path d="m12 3 3 6 6 1-4.5 4.5 1 6.5-5.5-3-5.5 3 1-6.5L3 10l6-1 3-6Z"/>',check:'<path d="m5 12 4 4L19 6"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/>',fire:'<path d="M13 2c2 6-4 6-3 11 2-1 4-3 4-5 7 7 4 14-2 14-7 0-11-8-5-13-1 5 1 5 2 6-1-6 4-7 4-13Z"/>',repeat:'<path d="M20 7H7a4 4 0 0 0-4 4m1 6h13a4 4 0 0 0 4-4M17 3l4 4-4 4M7 13l-4 4 4 4"/>'};
const ico=(name)=>`<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS[name]||ICONS.book}</svg></span>`;
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s)=>document.querySelector(s);const KEY='phrase-lab-v1';
const defaults=()=>({version:1,prefs:{theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light',sound:true,rate:.85,voice:'',goal:10,phon:true},records:{},activity:{},quiz:{correct:0,total:0}});
let state=defaults(),storageWarning=false;
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw))}catch(e){storageWarning=true}
function validate(s){if(!s||s.version!==1||typeof s.records!=='object'||!s.records||typeof s.activity!=='object'||!s.activity)throw Error('Formato de respaldo inválido.');const out=defaults(),p=s.prefs||{};out.prefs={theme:p.theme==='dark'?'dark':'light',sound:p.sound!==false,rate:[.6,.75,.85,1,1.15].includes(p.rate)?p.rate:.85,voice:typeof p.voice==='string'?p.voice.slice(0,300):'',goal:[5,10,15,20].includes(p.goal)?p.goal:10,phon:p.phon!==false};for(const f of PHRASES){const r=s.records[f.id];if(!r||typeof r!=='object')continue;out.records[f.id]={fav:r.fav===true,reviews:bounded(r.reviews),good:Math.min(20,bounded(r.good)),due:Number.isFinite(r.due)?Math.max(0,Math.min(4102444800000,r.due)):0,last:Number.isFinite(r.last)?Math.max(0,Math.min(4102444800000,r.last)):0}}for(const [d,v] of Object.entries(s.activity)){if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(v))out.activity[d]=bounded(v)}out.quiz={correct:bounded(s.quiz?.correct),total:bounded(s.quiz?.total)};out.quiz.correct=Math.min(out.quiz.correct,out.quiz.total);return out}
function bounded(n){return Number.isInteger(n)&&n>=0?Math.min(n,1000000):0}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('No se pudo guardar. Exporta tu progreso desde Ajustes.')}}
function dayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function rec(id){return state.records[id]||{fav:false,reviews:0,good:0,due:0,last:0}}
function mastered(f){return rec(f.id).good>=3}
function streak(){let n=0,d=new Date();if(!state.activity[dayKey(d)])d.setDate(d.getDate()-1);while(state.activity[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n}
let audioCtx;function beep(kind='click'){if(!state.prefs.sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const t=audioCtx.currentTime;o.type='sine';o.frequency.setValueAtTime(kind==='success'?660:kind==='error'?240:450,t);o.frequency.exponentialRampToValueAtTime(kind==='success'?990:kind==='error'?180:560,t+.09);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.start(t);o.stop(t+.16)}catch(e){}}
let voices=[],utterance=null;function loadVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices().filter(v=>/^en(?:-|_|$)/i.test(v.lang));if(route==='ajustes')fillVoices()}
if('speechSynthesis'in window){speechSynthesis.addEventListener('voiceschanged',loadVoices)}
function speak(id,slow=false){const f=PHRASES.find(x=>x.id===id);if(!f)return;if(!('speechSynthesis'in window)){toast('Este navegador no ofrece audio de voz. Prueba con un navegador actualizado.');return}const chosen=voices.find(v=>v.voiceURI===state.prefs.voice)||voices.find(v=>v.lang==='en-US')||voices[0];speechSynthesis.cancel();utterance=new SpeechSynthesisUtterance(f.en);utterance.lang=chosen?.lang||'en-US';if(chosen)utterance.voice=chosen;utterance.rate=slow?.6:state.prefs.rate;utterance.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))toast('No se pudo reproducir la voz. Revisa la voz de inglés o tu conexión.');};speechSynthesis.speak(utterance)}
let toastTimer;function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4200)}
const NAV=[['inicio','home','Inicio'],['frases','book','Frases'],['estudio','study','Estudiar'],['guia','guide','Guía'],['progreso','chart','Progreso']];
let route='inicio',levelFilter=-1,topicFilter='all',statusFilter='all',search='',limit=12,studyMode='cards',studyLevel=-1,studySource='smart',session=null;
function chrome(){document.documentElement.dataset.theme=state.prefs.theme;document.querySelector('meta[name=theme-color]').content=state.prefs.theme==='dark'?'#151c1a':'#f7f6f2';$('#nav').innerHTML=NAV.map(([r,i,t])=>`<button data-route="${r}" class="${route===r?'active':''}" ${route===r?'aria-current="page"':''}>${ico(i)}<span>${t}</span></button>`).join('');$('#crumb').textContent=NAV.find(n=>n[0]===route)?.[2]||'Ajustes';$('#themeBtn').innerHTML=ico(state.prefs.theme==='dark'?'sun':'moon');$('#themeBtn').setAttribute('aria-label',state.prefs.theme==='dark'?'Activar modo claro':'Activar modo oscuro');$('#soundBtn').innerHTML=ico(state.prefs.sound?'sound':'mute');$('#soundBtn').setAttribute('aria-label',state.prefs.sound?'Desactivar efectos de sonido':'Activar efectos de sonido');$('#soundBtn').setAttribute('aria-pressed',state.prefs.sound);$('#settingsBtn').innerHTML=ico('settings');$('#streak').innerHTML=`${ico('fire')} ${streak()} <span>${streak()===1?'día':'días'} de racha</span>`}
function navigate(r,focus=false){if(![...NAV.map(n=>n[0]),'ajustes'].includes(r))r='inicio';if(route!==r&&'speechSynthesis'in window)speechSynthesis.cancel();route=r;chrome();render();if(focus){window.scrollTo({top:0,behavior:'instant'});$('#content').focus({preventScroll:true})}}
function go(r){if(location.hash==='#'+r)navigate(r,true);else location.hash=r}
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1),true));
function render(){const main=$('#content');main.innerHTML=({inicio:home,frases:library,estudio:study,guia:guide,progreso:progress,ajustes:settings}[route])();main.classList.remove('fade');void main.offsetWidth;main.classList.add('fade');if(route==='ajustes')fillVoices()}
function statBlocks(){const learned=PHRASES.filter(mastered).length,seen=PHRASES.filter(f=>rec(f.id).reviews>0).length,review=PHRASES.filter(f=>rec(f.id).reviews>0&&rec(f.id).due<=Date.now()).length;return `<div class="stats"><div class="stat"><span class="small">Frases disponibles</span><b>${PHRASES.length}<span class="small"> / 4 niveles</span></b></div><div class="stat"><span class="small">Frases practicadas</span><b>${seen}<span class="small"> / ${PHRASES.length}</span></b></div><div class="stat"><span class="small">Consolidadas</span><b>${learned}<span class="small"> / ${PHRASES.length}</span></b></div><div class="stat"><span class="small">Repasos pendientes</span><b>${review}<span class="small"> para hoy</span></b></div></div>`}
function home(){const date=new Date(),day=Math.floor(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/86400000),f=PHRASES[day%PHRASES.length],today=state.activity[dayKey()]||0;return `<section class="hero"><div><div class="eyebrow">TU PRÓXIMA CONVERSACIÓN EMPIEZA AQUÍ</div><h1>Grandes conversaciones.<br>Una frase a la vez.</h1><p class="lead">Escucha cómo suena, descubre qué significa y hazla parte de tu inglés. A tu ritmo, todos los días.</p><div class="actions"><button class="btn primary" data-route="estudio">${ico('play')} Empezar a practicar</button><button class="btn" data-route="frases">Explorar frases ${ico('arrow')}</button></div></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="speech-card"><span class="eyebrow">A LITTLE EVERY DAY</span><div class="quote">“Let's try<br>again.”</div><div class="small muted">Tu voz también cuenta.</div><div style="margin-top:15px;color:var(--green)">▂ ▅ ▃ ▇ ▄ ▂ ▆ ▃ ▅ ▂ ▄</div></div><div class="floating">✦ Small steps. Real progress.</div></div></section>${statBlocks()}<div class="section-head"><h2>Encuentra tu punto de partida</h2><button class="text-btn" data-route="guia">Cómo estudiar ↗</button></div><div class="levels">${LEVELS.map((l,i)=>{const n=PHRASES.filter(f=>f.level===i&&mastered(f)).length;return `<button class="level-card" data-level="${i}"><div class="level-icon">${l.icon}</div><span class="eyebrow">NIVEL ${String(i+1).padStart(2,'0')}</span><h3 style="margin-top:5px">${l.name} ${ico('arrow')}</h3><p>${l.desc}</p><div class="level-foot"><span>40 frases</span><span>${n} consolidadas</span></div><div class="bar"><span style="width:${n/40*100}%"></span></div></button>`}).join('')}</div><div class="bottom-grid"><section class="panel daily"><span class="eyebrow">TU FRASE DEL DÍA</span><button class="sentence" lang="en" data-speak="${f.id}" title="Escuchar frase">${esc(f.en)} ${ico('sound')}</button><p class="phonetic">${esc(f.phon)}</p><details class="translation"><summary>Descubrir el significado</summary><p>${esc(f.es)}</p></details></section><section class="panel"><span class="eyebrow">TU PEQUEÑO COMPROMISO</span><h3 style="margin:15px 0 8px">${today>=state.prefs.goal?'¡Meta de hoy cumplida!':'Hoy también cuenta.'}</h3><p class="small muted">${today} de ${state.prefs.goal} respuestas de práctica. Escuchar y explorar no aumenta este contador.</p><div class="bar" style="margin:18px 0"><span style="width:${Math.min(100,today/state.prefs.goal*100)}%"></span></div><button class="text-btn" data-route="estudio">Continuar mi práctica →</button></section></div><p class="small muted">Los niveles son rutas orientativas, no una certificación del MCER. Puedes explorar cualquiera desde el inicio.</p>`}
function library(){return `<div class="section-intro"><div><span class="eyebrow">ESCUCHA · REPITE · DESCUBRE</span><h1>Tu colección de frases</h1><p class="lead">Pulsa una frase para escucharla. Intenta comprenderla antes de abrir su significado.</p></div><button class="btn primary" data-route="estudio">${ico('study')} Modo de estudio</button></div><div class="chips" aria-label="Filtrar por nivel">${[[-1,'Todos los niveles'],...LEVELS.map((l,i)=>[i,l.name])].map(([i,n])=>`<button class="chip ${levelFilter===i?'selected':''}" data-filter-level="${i}" aria-pressed="${levelFilter===i}">${n}</button>`).join('')}</div><div class="filters"><label class="field">Buscar frase o significado<input id="search" type="search" placeholder="Por ejemplo: coffee, trabajo, gracias…" value="${esc(search)}"></label><label class="field">Tema<select id="topic"><option value="all">Todos los temas</option>${[...new Set(PHRASES.filter(f=>levelFilter<0||f.level===levelFilter).map(f=>f.topic))].sort().map(t=>`<option ${topicFilter===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label><label class="field">Mi colección<select id="status">${[['all','Todas las frases'],['fav','Mis favoritas'],['new','Sin practicar'],['learning','En aprendizaje'],['known','Consolidadas'],['due','Repasos pendientes']].map(([v,n])=>`<option value="${v}" ${statusFilter===v?'selected':''}>${n}</option>`).join('')}</select></label></div><div id="results">${results()}</div><div class="notice"><b>Sobre la pronunciación:</b> la escritura es aproximada y toma como referencia un acento estadounidense general. Las sílabas con tilde orientan el énfasis; “j” representa una aspiración suave, “sh” el sonido de <i lang="en">she</i>, “th” el de <i lang="en">think</i> y “dh” el de <i lang="en">this</i>. Escucha la voz elegida: puede tener otro acento. <button class="text-btn" data-route="guia">Ver guía de sonidos →</button></div>`}
function normalized(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function filtered(){const q=normalized(search);return PHRASES.filter(f=>(levelFilter<0||f.level===levelFilter)&&(topicFilter==='all'||f.topic===topicFilter)&&(!q||normalized(f.en+' '+f.es+' '+f.topic).includes(q))&&(statusFilter==='all'||statusFilter==='fav'&&rec(f.id).fav||statusFilter==='new'&&!rec(f.id).reviews||statusFilter==='learning'&&rec(f.id).reviews>0&&!mastered(f)||statusFilter==='known'&&mastered(f)||statusFilter==='due'&&rec(f.id).reviews>0&&rec(f.id).due<=Date.now()))}
function results(){const list=filtered();return `<div class="collection-meta"><span>${list.length} ${list.length===1?'frase encontrada':'frases encontradas'}</span><span>Audio al pulsar ${ico('sound')}</span></div><div class="cards">${list.slice(0,limit).map(card).join('')||'<div class="empty"><h3>No hay frases con estos filtros</h3><p class="small muted">Prueba otro tema o busca una palabra más corta.</p><button class="btn" id="clearFilters">Restablecer filtros</button></div>'}</div>${limit<list.length?`<div class="center" style="margin:25px"><button class="btn" id="more">Mostrar 12 más (${Math.min(limit,list.length)} de ${list.length})</button></div>`:''}`}
function tip(f){if(f.tip)return f.tip;const tips={Saludos:'Escucha la entonación y repite la frase completa. En una pregunta con what o where, la entonación suele bajar al final.', 'Vida diaria':'Aprende la frase como un bloque. Después cambia una palabra para usarla en una situación de tu día.', 'Compras y comida':'Could e I’d like ayudan a pedir con cortesía. Practica con distintos productos y conserva el resto de la frase.',Viajes:'Practica primero despacio. Luego imagina que estás en el lugar y di la frase sin leer.',Conversación:'Escucha qué palabras destacan. Repite copiando su ritmo y piensa en una respuesta para mantener la conversación.',Trabajo:'Observa el grado de formalidad. Practica la frase pensando en una reunión o un mensaje de trabajo.',Opiniones:'Identifica la parte que introduce tu opinión. Reutilízala con una idea propia y añade una razón.',Decisiones:'Relaciona la estructura con su intención: aconsejar, imaginar o evaluar una decisión. Cambia la situación y conserva el patrón.',Experiencias:'Ubica cuándo ocurre cada acción antes de repetirla. Presta atención a los auxiliares y a los participios.',Relaciones:'El tono modifica cómo se recibe el mensaje. Practica con una entonación tranquila y escucha las contracciones.',Matices:'Reconstruye la frase sin inversión o sin énfasis para entender su estructura. Estas formas suelen ser más formales.',Argumentación:'Identifica si la frase afirma, cuestiona o limita una conclusión. Conserva los matices al usarla.',Negociación:'Practica una pausa entre la propuesta y la condición. Explica con tus palabras qué acuerdo estás sugiriendo.',Estructuras:'Divide la frase en dos partes y reconoce el sujeto, los auxiliares y el tiempo verbal antes de unirla.',Expresiones:'Aprende la expresión completa en una situación. El significado es idiomático y no siempre se deduce palabra por palabra.'};return tips[f.topic]||'Escucha, repite y construye un ejemplo propio con esta frase.'}
function card(f){const r=rec(f.id);return `<article class="phrase" id="phrase-${f.id}"><div class="card-top"><span class="tag">${LEVELS[f.level].name} · ${esc(f.topic)}</span><div class="tools"><button class="icon-btn ${r.fav?'favorite-on':''}" data-fav="${f.id}" aria-label="${r.fav?'Quitar de':'Agregar a'} favoritas: ${esc(f.en)}" aria-pressed="${r.fav}">${ico('star')}</button><button class="icon-btn" data-slow="${f.id}" aria-label="Escuchar despacio: ${esc(f.en)}" title="Audio lento">${ico('repeat')}</button></div></div><button class="sentence" lang="en" data-speak="${f.id}" aria-label="Escuchar: ${esc(f.en)}">${ico('sound')}<span>${esc(f.en)}</span></button>${state.prefs.phon?`<p class="phonetic">${esc(f.phon)}</p>`:'<div style="height:18px"></div>'}<details class="translation"><summary>Mostrar significado y consejo</summary><p>${esc(f.es)}</p><div class="note">✦ ${esc(tip(f))}</div></details><div class="learn-state" style="margin-top:14px">${mastered(f)?ico('check'):'○'} ${mastered(f)?'Consolidada':r.reviews?'En aprendizaje · '+r.reviews+' repasos':'Aún sin practicar'}</div></article>`}
function study(){if(session)return sessionView();return `<div class="section-intro"><div><span class="eyebrow">UN POCO DE PRÁCTICA, MUCHO CAMINO</span><h1>Tu momento de inglés</h1><p class="lead">Sesiones breves para recordar más y depender menos de la traducción.</p></div></div><section class="panel study-setup"><h2>Prepara tu sesión</h2><p class="small muted" style="margin-top:9px">Elige cómo quieres practicar hoy. Todos los niveles están abiertos.</p><div class="mode-options"><button class="mode-option ${studyMode==='cards'?'active':''}" data-mode="cards" aria-pressed="${studyMode==='cards'}">${ico('book')}<strong>Tarjetas de memoria</strong><span>Recuerda el significado, compruébalo y evalúa cómo te fue.</span></button><button class="mode-option ${studyMode==='quiz'?'active':''}" data-mode="quiz" aria-pressed="${studyMode==='quiz'}">${ico('check')}<strong>Reto de significado</strong><span>Escucha o lee una frase y elige su traducción entre cuatro opciones.</span></button></div><label class="field">Nivel<select id="studyLevel"><option value="-1">Mezclar todos los niveles</option>${LEVELS.map((l,i)=>`<option value="${i}" ${studyLevel===i?'selected':''}>${l.name} · ${l.range}</option>`).join('')}</select></label><label class="field">Qué practicar<select id="studySource">${[['smart','Repaso inteligente: pendientes y nuevas'],['all','Toda la colección, al azar'],['fav','Solo mis favoritas']].map(([v,n])=>`<option value="${v}" ${studySource===v?'selected':''}>${n}</option>`).join('')}</select></label><div class="notice"><b>Así funciona:</b> en tarjetas, intenta recordar antes de revelar. En el reto, cada respuesta cuenta una sola vez. Tres aciertos de repaso seguidos consolidan una frase; sigue revisándola cuando le toque.</div><button class="btn primary" id="startSession" style="width:100%">Empezar · hasta ${state.prefs.goal} frases ${ico('arrow')}</button><p class="small muted" style="margin:16px 0 0">El progreso se guarda después de cada respuesta. Tu meta se cambia en Ajustes. Las sesiones en curso se conservan mientras esta página siga abierta.</p></section>`}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startSession(){let pool=PHRASES.filter(f=>(studyLevel<0||f.level===studyLevel)&&(studySource!=='fav'||rec(f.id).fav));if(!pool.length){toast('Agrega algunas favoritas en la colección o elige otro nivel.');return}if(studySource==='smart'){const due=shuffle(pool.filter(f=>rec(f.id).reviews&&rec(f.id).due<=Date.now()));const fresh=shuffle(pool.filter(f=>!rec(f.id).reviews));pool=[...due,...fresh];if(!pool.length){toast('¡Estás al día! Elige toda la colección para practicar más.');return}}else pool=shuffle(pool);session={mode:studyMode,queue:pool.slice(0,state.prefs.goal).map(f=>f.id),index:0,revealed:false,answered:false,choice:null,correct:0,again:0,easy:0,options:null};beep();render()}
function sessionView(){const s=session,total=s.queue.length;if(s.index>=total)return `<section class="study-card"><div class="level-icon" style="margin:10px auto 25px;background:var(--accent);color:#233322">✦</div><span class="eyebrow">SESIÓN COMPLETADA</span><h1 style="font-size:37px">¡Un paso más!</h1><p>Practicaste ${total} ${total===1?'frase':'frases'}${s.mode==='quiz'?` y acertaste ${s.correct} (${Math.round(s.correct/total*100)}%).`:'.'}</p><p class="small muted">${s.again?`${s.again} ${s.again===1?'frase necesita':'frases necesitan'} otro vistazo. Volverán a aparecer en el repaso inteligente.`:'Buen trabajo. Los próximos repasos ya están programados.'}</p><div class="actions" style="justify-content:center;margin-top:28px"><button class="btn primary" id="newSession">Preparar otra sesión</button><button class="btn" data-route="progreso">Ver mi progreso ${ico('arrow')}</button></div></section>`;const f=PHRASES.find(x=>x.id===s.queue[s.index]);if(s.mode==='quiz'&&!s.options)s.options=shuffle([f,...shuffle(PHRASES.filter(x=>x.level===f.level&&x.id!==f.id)).slice(0,3)]).map(x=>x.id);return `<div class="study-top"><span class="small muted">${s.mode==='cards'?'Tarjetas de memoria':'Reto de significado'} · ${s.index+1} de ${total}</span><button class="text-btn" id="endSession">Terminar sesión</button></div><div class="bar study-progress"><span style="width:${s.index/total*100}%"></span></div><section class="study-card"><span class="tag">${LEVELS[f.level].name} · ${esc(f.topic)}</span><button class="sentence" lang="en" data-speak="${f.id}">${ico('sound')}${esc(f.en)}</button>${state.prefs.phon?`<p class="phonetic">${esc(f.phon)}</p>`:''}<button class="text-btn" data-slow="${f.id}">Escuchar más despacio</button>${s.mode==='cards'?s.revealed?`<p class="answer">${esc(f.es)}</p><div class="explain">✦ ${esc(tip(f))}</div><p class="small muted">¿Pudiste recordar el significado sin verlo?</p><div class="ratings"><button class="btn" data-rate="again">Otra vez<small>Repetir pronto · tecla 1</small></button><button class="btn primary" data-rate="good">Lo recordé<small>Repaso normal · tecla 2</small></button><button class="btn lime" data-rate="easy">Muy fácil<small>Repaso más lejano · tecla 3</small></button></div>`:`<p class="muted" style="margin:28px 0 20px">¿Qué significa? Respóndelo en voz alta o para ti.</p><button class="btn primary" id="reveal">Revelar significado</button><p class="small muted" style="margin-top:18px">En computadora también puedes pulsar Espacio.</p>`:`<p class="small muted" style="margin-top:25px">Elige el significado que corresponde a la frase.</p><div class="quiz-choices">${s.options.map((id,i)=>{const o=PHRASES.find(x=>x.id===id);return `<button class="choice ${s.answered?(id===f.id?'correct':id===s.choice?'wrong':''):''}" data-choice="${id}" ${s.answered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o.es)}${s.answered&&id===f.id?' ✓':''}</button>`}).join('')}</div>${s.answered?`<p style="color:${s.choice===f.id?'var(--green)':'var(--bad)'}">${s.choice===f.id?'¡Bien! Reconociste el significado.':'Sigue practicando. La respuesta correcta está marcada.'}</p><div class="explain">✦ ${esc(tip(f))}</div><button class="btn primary" id="nextQuestion">${s.index+1===total?'Ver resultado':'Siguiente frase'} ${ico('arrow')}</button>`:''}`}</section>`}
function logReview(id,rating){const r={...rec(id)},now=Date.now();r.reviews++;r.last=now;if(rating==='again'){r.good=0;r.due=now+600000}else{r.good=Math.min(20,r.good+1);const days=(rating==='easy'?[3,7,14,30,60]:[1,3,7,14,30])[Math.min(r.good-1,4)];r.due=now+days*86400000}state.records[id]=r;state.activity[dayKey()]=(state.activity[dayKey()]||0)+1;save();chrome()}
function rate(rating){if(!session||session.mode!=='cards'||!session.revealed||session.index>=session.queue.length)return;logReview(session.queue[session.index],rating);if(rating==='again')session.again++;if(rating==='easy')session.easy++;beep(rating==='again'?'click':'success');next()}
function next(){session.index++;session.revealed=false;session.answered=false;session.options=null;session.choice=null;render()}
const LESSONS=[
['Tu rutina de 10 minutos','Escuchar no es lo mismo que recordar. Alterna comprensión y producción.','Escucha → repite → recuerda → usa.', ['2 minutos: escucha tres frases sin leer la traducción. Intenta captar la idea general.','3 minutos: repite cada frase, primero despacio y después al ritmo del audio.','3 minutos: practica con las tarjetas e intenta recordar antes de revelar.','2 minutos: cambia un dato de una frase y úsala en una situación tuya.']],
['Cómo leer la pronunciación escrita','Es un apoyo inicial, no una transcripción fonética exacta ni una sustitución del audio. Los acentos escritos orientan qué sílaba destacar.','Thank you → thánk iu · This → dhis',['“th”: coloca suavemente la punta de la lengua entre los dientes y deja pasar aire, sin vibración, como en think.','“dh”: usa una posición parecida, con vibración, como en this. “sh” es el sonido continuo de she; no es “ch”.','La “j” representa la h inglesa: aire suave, no la j fuerte del español. La r inglesa tampoco se vibra como nuestra rr.','La guía no refleja todos los enlaces ni reducciones. Usa siempre el audio como referencia principal.']],
['Ritmo, enlaces y shadowing','En inglés no todas las palabras reciben el mismo énfasis. Nombres, verbos principales y palabras clave suelen destacar.','I NEED some WATER.',['Escucha una vez sin hablar. Luego repite justo después de la voz: esto se conoce como shadowing.','Empieza con fragmentos cortos. Une el final de una palabra con el inicio de la siguiente cuando fluya de forma natural.','No busques máxima velocidad. Primero prioriza claridad y ritmo.','Lee en voz alta sin mirar, y comprueba el resultado escuchando de nuevo.']],
['El sonido débil: schwa /ə/','Muchas vocales sin énfasis se relajan hacia un sonido central breve. No siempre suenan como sus letras.','about /əˈbaʊt/ · a cup of tea',['En about, la primera a no es una a española clara y fuerte.','En habla fluida, a, to, of y otras palabras gramaticales pueden reducirse.','La escritura aproximada de esta aplicación simplifica esos sonidos. Evita pronunciar cada sílaba con igual fuerza.']],
['Contracciones que escucharás todo el tiempo','Las contracciones hacen que el inglés cotidiano suene más natural. Aprende también la forma completa.','I’m = I am · I’d like = I would like',['I’ve = I have; I’ll = I will; don’t = do not; haven’t = have not.','I’d puede significar I would o I had: I’d go = I would go; I’d gone = I had gone.','En correspondencia muy formal puedes preferir algunas formas completas. El contexto importa.']],
['Presente simple y presente continuo','El presente simple describe hábitos o hechos. El continuo suele describir acciones en curso o situaciones temporales.','I work from home. / I’m working from home today.',['Simple: I study. Pregunta: Do you study? Con he/she/it: studies o does.','Continuo: am/is/are + verbo-ing. No omitas el auxiliar.','Prueba a describir tu rutina y luego lo que haces en este momento.']],
['Pedir ayuda con cortesía','Can funciona en muchas situaciones. Could y Would suelen hacer una petición más cortés o menos directa.','Could you help me? · I’d like a coffee.',['I want a coffee es directo; I’d like a coffee suele sonar más amable.','Would you mind opening…? lleva verbo-ing. Para aceptar, No, not at all significa que no te molesta.','No traduzcas palabra por palabra “me gustaría”: I would like suele ser la estructura que necesitas.']],
['Pasado simple y present perfect','El pasado simple sitúa un hecho en un pasado terminado. El present perfect conecta una experiencia o un resultado con el presente.','I finished it yesterday. / I’ve already finished it.',['Pasado simple: verbo en pasado. En pregunta y negación: did/didn’t + verbo base.','Present perfect: have/has + participio. Already suele indicar que algo ya ocurrió; yet es común en preguntas y negativas.','Con un momento pasado terminado como yesterday, normalmente usa pasado simple. El uso puede variar según el contexto y el acento.']],
['For, since y la duración','For expresa cuánto dura algo; since, desde qué momento comenzó.','I’ve been learning for a year. / I’ve been learning since January.',['For two hours, for three days, for a year.','Since Monday, since 2020, since I was a child.','Have been + verbo-ing conecta una actividad que empezó antes con el presente.']],
['Condicionales sin enredos','Piensa primero si la situación es posible, imaginaria o una alternativa a un pasado que ya ocurrió.','If it rains, we’ll stay. / If I were you, I’d go.',['Posibilidad futura: if + presente, will + verbo.','Situación hipotética presente: if + pasado, would + verbo.','Pasado alternativo: if + had + participio, would have + participio.','La coma suele usarse cuando la oración con if va primero. Evita añadir will automáticamente después de if.']],
['Los verbos con partícula','Un phrasal verb combina un verbo con una o más partículas. Su significado puede cambiar mucho.','put off = posponer · look into = investigar',['Apréndelo dentro de una frase y relaciónalo con una situación concreta.','Algunos permiten separar verbo y partícula. Con pronombre, try it on, no try on it.','Otros conservan su orden: look into the problem. No todos funcionan igual.']],
['Verbo-ing o infinitivo','La forma que sigue a un verbo o expresión depende de su patrón. Aprende el patrón junto con el vocabulario.','worth trying · decide to wait · would rather stay',['Would you mind + verbo-ing; there’s no point in + verbo-ing.','Decide, want y need suelen ir con to + verbo.','Después de can, could, should o would rather, usa verbo base sin to.','Hay verbos que admiten varias formas y cambian de significado. Practícalos en contexto.']],
['Deducciones y arrepentimientos','Un auxiliar modal más have + participio permite hablar del pasado con distintas intenciones.','must have been · might have missed · should have listened',['Must have: deducción con mucha confianza.','Might have o could have: posibilidad, según el contexto.','Should have: algo que habría sido conveniente hacer.','No confundas must have como deducción con had to como obligación pasada.']],
['Expresiones idiomáticas y contexto','Las expresiones no siempre se entienden traduciendo cada palabra. Recuerda su intención y su registro.','on the same page = en sintonía · last straw = la gota que derramó el vaso',['Imagina una escena para cada expresión. ¿Quién la dice, a quién y por qué?','No necesitas incluir muchas expresiones para sonar natural. Usa las que correspondan al contexto.','En informes formales, una formulación literal y clara puede resultar más adecuada que una expresión coloquial.']],
['Énfasis e inversión','Algunas estructuras formales cambian el orden habitual para dar énfasis o expresar una condición.','Not only did she apologize… / Had I known…',['Con Not only al principio, invierte auxiliar y sujeto. El verbo principal queda en su forma base cuando usas did.','Had I known equivale a If I had known. Were it not for equivale a If it were not for.','Reconoce primero la versión habitual. Después practica la versión con inversión.']],
['Cómo interpretar tu progreso','El repaso espaciado distribuye la práctica a lo largo del tiempo. La aplicación programa el siguiente repaso tras cada respuesta.','Otra vez: 10 min · Lo recordé: 1, 3, 7, 14, 30 días',['Muy fácil programa intervalos de 3, 7, 14, 30 y 60 días según tu racha de aciertos en esa frase.','Tres respuestas positivas consecutivas consolidan una frase. Una respuesta incorrecta o “Otra vez” reinicia esa racha.','El reto de significado mide reconocimiento, y las tarjetas usan tu autoevaluación. Ninguno evalúa automáticamente tu pronunciación.','La racha cuenta días consecutivos con respuestas de práctica. Escuchar, navegar o ver una traducción no suma respuestas.']]
];
function guide(){return `<div class="section-intro"><div><span class="eyebrow">COMPRENDER PARA USARLO</span><h1>Una guía para tu inglés</h1><p class="lead">Pequeñas explicaciones para que cada frase tenga sentido. Abre el tema que quieras explorar.</p></div></div><div class="notice"><b>Tu objetivo es comunicarte.</b> No necesitas sonar como otra persona. Busca que tu mensaje sea claro y reconoce que existen muchos acentos válidos. La voz sintética y la pronunciación escrita son apoyos; escuchar conversaciones reales también te ayudará.</div><div class="guide-grid">${LESSONS.map(([title,intro,ex,steps],i)=>`<details class="lesson" ${i===0?'open':''}><summary>${String(i+1).padStart(2,'0')} · ${title}</summary><p style="margin-top:15px">${intro}</p><div class="example">${ex}</div><ul>${steps.map(s=>`<li style="margin:9px 0">${s}</li>`).join('')}</ul></details>`).join('')}</div><section class="panel" style="margin-top:20px"><h3>Del ejemplo a tu propia conversación</h3><p class="small muted">Toma <span lang="en">“I'd like a coffee, please.”</span> y sustituye <span lang="en">coffee</span> por <span lang="en">tea</span> o <span lang="en">a glass of water</span>. Después imagina la respuesta de quien te atiende. Este pequeño cambio convierte una frase memorizada en un patrón que puedes usar.</p><button class="btn primary" data-route="frases">Ponerlo en práctica ${ico('arrow')}</button></section>`}
function progress(){const seen=PHRASES.filter(f=>rec(f.id).reviews>0).length,known=PHRASES.filter(mastered).length,total=Object.values(state.activity).reduce((a,b)=>a+b,0),today=state.activity[dayKey()]||0;const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return {d,n:state.activity[dayKey(d)]||0}}),max=Math.max(state.prefs.goal,...days.map(d=>d.n));return `<div class="section-intro"><div><span class="eyebrow">CADA REPASO DEJA HUELLA</span><h1>Tu inglés está creciendo</h1><p class="lead">Observa lo que has practicado y vuelve a las frases que necesitan un poco más de tiempo.</p></div><button class="btn primary" data-route="estudio">Seguir estudiando ${ico('arrow')}</button></div>${statBlocks()}<div class="bottom-grid"><section class="panel"><h3>Tu camino por nivel</h3>${LEVELS.map((l,i)=>{const all=PHRASES.filter(f=>f.level===i),k=all.filter(mastered).length,v=all.filter(f=>rec(f.id).reviews>0).length;return `<div class="progress-row"><div class="row"><b>${l.icon} ${l.name}</b><span>${k}/40 consolidadas</span></div><div class="bar"><span style="width:${k/40*100}%"></span></div><div class="small muted" style="margin-top:8px">${v} practicadas · ${v-k} en aprendizaje · ${40-v} nuevas</div></div>`}).join('')}</section><section class="panel"><h3>Tu última semana</h3><p class="small muted">Respuestas de práctica por día · ${streak()} ${streak()===1?'día':'días'} de racha</p><div class="days" role="img" aria-label="${days.map(x=>`${x.d.toLocaleDateString('es-MX')}: ${x.n} respuestas`).join('; ')}">${days.map(({d,n})=>`<div class="day"><b>${n}</b><div class="day-bar"><span style="height:${n/max*100}%"></span></div>${d.toLocaleDateString('es-MX',{weekday:'short'}).replace('.','')}</div>`).join('')}</div><div class="notice"><b>${today} / ${state.prefs.goal}</b> respuestas de tu meta diaria.<div class="bar" style="margin-top:12px"><span style="width:${Math.min(100,today/state.prefs.goal*100)}%"></span></div></div><p class="small muted">${total} respuestas en total. Tu meta cuenta respuestas, por lo que una frase puede aparecer más de una vez a lo largo del día.</p></section></div><div class="bottom-grid"><section class="panel"><span class="eyebrow">RECONOCER SIGNIFICADOS</span><h3 style="margin:12px 0">${state.quiz.total?Math.round(state.quiz.correct/state.quiz.total*100)+'% de aciertos':'Tu primer reto te espera'}</h3><p class="small muted">${state.quiz.correct} ${state.quiz.correct===1?'respuesta correcta':'respuestas correctas'} de ${state.quiz.total} en el reto de significado. Este resultado mide reconocimiento en la aplicación, no tu nivel global de inglés.</p></section><section class="panel"><span class="eyebrow">UNA COLECCIÓN QUE CRECE CONTIGO</span><h3 style="margin:12px 0">${Math.round(known/PHRASES.length*100)}% consolidado</h3><p class="small muted">${known} frases con al menos tres aciertos consecutivos. Has practicado ${seen} ${seen===1?'frase distinta':'frases distintas'}. Recuerda volver cuando toque el siguiente repaso.</p></section></div><div class="notice"><b>Tus datos están en este navegador.</b> Borrar los datos del sitio o cambiar de dispositivo no transfiere tu progreso. Guarda un respaldo desde <button class="text-btn" data-route="ajustes">Ajustes →</button></div>`}
function settings(){return `<div class="section-intro"><div><span class="eyebrow">A TU RITMO, A TU MANERA</span><h1>Hazlo tuyo</h1><p class="lead">Ajusta el audio, tu meta y el aspecto de tu espacio de práctica.</p></div></div><div class="settings-grid"><section class="panel"><h3>Voz y pronunciación</h3><label class="field">Voz en inglés<select id="voice"><option>Cargando voces…</option></select></label><p class="small muted">Las voces dependen del navegador y del dispositivo. Algunas necesitan conexión. Si no aparece ninguna, habilita o instala una voz de inglés en tu sistema y vuelve a abrir la página.</p><label class="field">Velocidad de lectura<select id="rate">${[[.6,'Muy lenta · 0.60×'],[.75,'Lenta · 0.75×'],[.85,'Tranquila · 0.85×'],[1,'Normal · 1.00×'],[1.15,'Ágil · 1.15×']].map(([v,t])=>`<option value="${v}" ${state.prefs.rate===v?'selected':''}>${t}</option>`).join('')}</select></label><button class="btn" data-speak="0-0">${ico('sound')} Probar la voz</button><button class="btn" id="stopAudio" style="margin-top:10px">Detener audio</button><label class="toggle-row"><span>Efectos de sonido<br><span class="small muted">Clics y respuestas de práctica</span></span><input type="checkbox" id="soundToggle" ${state.prefs.sound?'checked':''}></label><label class="toggle-row"><span>Mostrar pronunciación escrita<br><span class="small muted">Guía aproximada en español</span></span><input type="checkbox" id="phonToggle" ${state.prefs.phon?'checked':''}></label></section><section class="panel"><h3>Tu rutina y apariencia</h3><label class="field">Meta diaria y tamaño de sesión<select id="goal">${[5,10,15,20].map(n=>`<option value="${n}" ${state.prefs.goal===n?'selected':''}>${n} respuestas al día · sesiones de hasta ${n} frases</option>`).join('')}</select></label><label class="field">Tema<select id="theme"><option value="light" ${state.prefs.theme==='light'?'selected':''}>Claro · luz de día</option><option value="dark" ${state.prefs.theme==='dark'?'selected':''}>Oscuro · noche tranquila</option></select></label><div class="notice"><b>Tu progreso es personal.</b> No se envía a una cuenta ni se sincroniza entre dispositivos. La reproducción de voz la gestiona tu navegador o sistema.</div><h3 style="margin-top:30px">Respaldo de tu progreso</h3><p class="small muted">Exporta un archivo JSON con tus avances, favoritas y ajustes. Puedes importarlo en otro navegador donde abras esta misma aplicación.</p><div class="actions"><button class="btn" id="export">Exportar respaldo ↓</button><button class="btn" id="import">Importar respaldo ↑</button></div><p class="small muted" style="margin-top:13px">Importar reemplaza el progreso actual por el del archivo. Se pedirá confirmación antes de hacerlo.</p><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><button class="btn danger" id="reset">Borrar mi progreso</button><p class="small muted" style="margin:12px 0 0">Conserva tus favoritas y ajustes; borra respuestas, racha y repasos.</p></section></div><section class="panel" style="margin-top:20px"><h3>Listo para GitHub Pages</h3><p class="small muted">La aplicación completa está en este index.html. No necesita bases de datos, bibliotecas externas ni claves de acceso. Sube el archivo a la raíz de tu repositorio y activa Pages para esa rama y carpeta. El audio requiere que pulses una frase. Sin voces compatibles el contenido y el estudio siguen disponibles.</p><p class="small muted" style="margin-bottom:0">Si abres directamente el archivo desde tu computadora, la conservación del progreso puede variar según el navegador. Para un uso estable, utiliza la dirección de GitHub Pages y exporta respaldos periódicamente.</p></section>`}
function fillVoices(){const sel=$('#voice');if(!sel)return;sel.innerHTML='<option value="">Automática · inglés</option>'+voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===state.prefs.voice?'selected':''}>${esc(v.name)} · ${esc(v.lang)}${v.localService?' · local':''}</option>`).join('');if(!voices.length)sel.options[0].textContent='Predeterminada del sistema · sin lista de voces'}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`phrase-lab-progreso-${dayKey()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Respaldo exportado. Guárdalo para recuperar tu progreso.')}
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('El archivo es demasiado grande. Elige un respaldo de Phrase Lab.');const imported=validate(JSON.parse(await file.text()));if(!confirm('¿Reemplazar tus avances, favoritas y ajustes con los de este respaldo? Exporta primero si deseas conservar el progreso actual.'))return;state=imported;session=null;save();chrome();render();toast('Progreso importado correctamente.')}catch(err){toast(err instanceof SyntaxError?'El archivo no es un respaldo JSON válido.':err.message)}finally{e.target.value=''}});
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();$('#content').focus();return}const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.route){beep();go(b.dataset.route);return}
if(b.dataset.speak){speak(b.dataset.speak);return}if(b.dataset.slow){speak(b.dataset.slow,true);return}
if(b.dataset.level!==undefined){levelFilter=+b.dataset.level;topicFilter='all';statusFilter='all';search='';limit=12;beep();go('frases');return}
if(b.dataset.filterLevel!==undefined){levelFilter=+b.dataset.filterLevel;topicFilter='all';limit=12;beep();render();return}
if(b.dataset.fav){const id=b.dataset.fav;state.records[id]={...rec(id),fav:!rec(id).fav};save();beep();const r=rec(id);b.classList.toggle('favorite-on',r.fav);b.setAttribute('aria-pressed',r.fav);const f=PHRASES.find(x=>x.id===id);b.setAttribute('aria-label',`${r.fav?'Quitar de':'Agregar a'} favoritas: ${f.en}`);toast(r.fav?'Frase guardada en favoritas.':'Frase retirada de favoritas.');if(statusFilter==='fav')$('#results').innerHTML=results();return}
if(b.dataset.mode){studyMode=b.dataset.mode;beep();render();return}
if(b.dataset.rate){rate(b.dataset.rate);return}
if(b.dataset.choice){if(!session||session.mode!=='quiz'||session.answered||session.index>=session.queue.length)return;session.answered=true;session.choice=b.dataset.choice;const correct=session.choice===session.queue[session.index];if(correct)session.correct++;else session.again++;state.quiz.total++;if(correct)state.quiz.correct++;logReview(session.queue[session.index],correct?'good':'again');beep(correct?'success':'error');render();return}
switch(b.id){case 'themeBtn':state.prefs.theme=state.prefs.theme==='dark'?'light':'dark';save();chrome();if(route==='ajustes')render();beep();break;case 'soundBtn':state.prefs.sound=!state.prefs.sound;save();chrome();if(route==='ajustes')render();beep();break;case 'clearFilters':levelFilter=-1;topicFilter=statusFilter='all';search='';limit=12;render();break;case 'more':limit+=12;$('#results').innerHTML=results();break;case 'startSession':startSession();break;case 'reveal':if(session){session.revealed=true;beep();render()}break;case 'nextQuestion':if(session?.answered)next();break;case 'newSession':session=null;render();break;case 'endSession':if(confirm('¿Terminar esta sesión? Las respuestas que ya diste están guardadas.')){session=null;render()}break;case 'export':exportData();break;case 'import':$('#importFile').click();break;case 'reset':if(confirm('¿Borrar las respuestas, racha y repasos? Se conservarán tus favoritas y ajustes.')){const records={};PHRASES.forEach(f=>{if(rec(f.id).fav)records[f.id]={fav:true,reviews:0,good:0,due:0,last:0}});state.records=records;state.activity={};state.quiz={correct:0,total:0};session=null;save();chrome();render();toast('Progreso reiniciado. Tus favoritas se conservaron.')}break;case 'stopAudio':if('speechSynthesis'in window)speechSynthesis.cancel();break;}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;limit=12;$('#results').innerHTML=results()}});
document.addEventListener('change',e=>{const t=e.target;switch(t.id){case 'topic':topicFilter=t.value;limit=12;$('#results').innerHTML=results();break;case 'status':statusFilter=t.value;limit=12;$('#results').innerHTML=results();break;case 'studyLevel':studyLevel=+t.value;break;case 'studySource':studySource=t.value;break;case 'voice':state.prefs.voice=t.value;save();break;case 'rate':state.prefs.rate=+t.value;save();break;case 'goal':state.prefs.goal=+t.value;save();toast('Meta diaria actualizada.');break;case 'theme':state.prefs.theme=t.value;save();chrome();break;case 'soundToggle':state.prefs.sound=t.checked;save();chrome();beep();break;case 'phonToggle':state.prefs.phon=t.checked;save();break;}});
document.addEventListener('keydown',e=>{if(route!=='estudio'||!session||session.index>=session.queue.length||['INPUT','SELECT','TEXTAREA','BUTTON','SUMMARY'].includes(document.activeElement.tagName))return;if(session.mode==='cards'){if(e.code==='Space'&&!session.revealed){e.preventDefault();session.revealed=true;render()}else if(session.revealed&&['1','2','3'].includes(e.key)){e.preventDefault();rate({'1':'again','2':'good','3':'easy'}[e.key])}}});
window.addEventListener('pagehide',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});
navigate(location.hash.slice(1)||'inicio');loadVoices();if(storageWarning)toast('No pudimos recuperar tus datos. Puedes importar un respaldo en Ajustes.');
</script>
