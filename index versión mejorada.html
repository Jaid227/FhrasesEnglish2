let state={cards:{},favorites:[],days:{},speed:.85,accent:'en-US',voice:''};try{Object.assign(state,JSON.parse(localStorage.getItem('phrase-garden-v1')||'{}'))}catch{}function save(){try{localStorage.setItem('phrase-garden-v1',JSON.stringify(state))}catch{toast('No se pudo guardar. Exporta un respaldo.')}}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4000)}function day(){return new Date().toLocaleDateString('en-CA')}function stats(){let c=Object.values(state.cards);return{seen:c.length,master:c.filter(x=>x.streak>=3).length,due:c.filter(x=>x.due<=Date.now()).length,reviews:Object.values(state.days).reduce((a,b)=>a+b,0)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function speak(id){if(!('speechSynthesis'in window)){toast('Este navegador no ofrece lectura de voz. Prueba Chrome, Edge o Safari.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(PHRASES[id].e);u.lang=state.accent;u.rate=Number(state.speed);let v=voices.find(x=>x.name===state.voice&&x.lang.startsWith(state.accent));if(v)u.voice=v;else{v=voices.find(x=>x.lang===state.accent)||voices.find(x=>x.lang.startsWith('en'));if(v)u.voice=v}u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('No se pudo reproducir. Revisa la conexión y las voces del dispositivo.')};speechSynthesis.speak(u)}if('speechSynthesis'in window){let load=()=>{voices=speechSynthesis.getVoices().filter(x=>x.lang.startsWith('en'));if(page==='guide')render()};speechSynthesis.onvoiceschanged=load;load()}
function levels(){return '<div class="levels">'+names.map((n,i)=>`<button class="level ${level===i?'active':''}" data-level="${i}">${String(i+1).padStart(2,'0')} · ${n}<small>${sub[i]} · 30 frases</small></button>`).join('')+'</div>'}function statHTML(){let s=stats();return `<div class="stats"><div class="stat"><strong>${s.seen}<small> / 120</small></strong><small>Frases practicadas</small></div><div class="stat"><strong>${s.master}</strong><small>Consolidadas · 3 aciertos seguidos</small></div><div class="stat"><strong>${s.due}</strong><small>Repasos pendientes</small></div><div class="stat"><strong>${state.days[day()]||0}<small> / 10</small></strong><small>Prácticas de hoy · meta sugerida</small></div></div>`}function card(p){let st=state.cards[p.id];return `<article class="card"><div class="card-top"><span>${p.c} · ${String(p.id%30+1).padStart(2,'0')}</span><button class="star" data-fav="${p.id}" aria-label="${state.favorites.includes(p.id)?'Quitar de':'Añadir a'} favoritos" aria-pressed="${state.favorites.includes(p.id)}">${state.favorites.includes(p.id)?'★':'☆'}</button></div><button class="speak" data-speak="${p.id}" lang="en" aria-label="Escuchar: ${esc(p.e)}">${p.e} <span style="font:14px system-ui">↗ ♪</span></button><p class="phon">${p.p}</p><details><summary>Descubrir significado</summary><p>${p.t}</p><span class="tag">${st?st.streak>=3?'✓ Consolidada':'En práctica':'Aún sin practicar'}</span></details></article>`}function results(){let a=PHRASES.filter(p=>p.level===level&&(!category||p.c===category)&&(!onlyFav||state.favorites.includes(p.id))&&(p.e+' '+p.t+' '+p.c).toLowerCase().includes(search.toLowerCase()));$('#results').innerHTML=a.length?a.map(card).join(''):'<div class="empty">No hay coincidencias. Prueba otra búsqueda o filtro.</div>';$('#count').textContent=a.length+' frases'}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let v=$('#view');if(page==='library'){v.innerHTML=`<section class="hero"><div><span class="eyebrow">TU ESPACIO PARA APRENDER INGLÉS</span><h1>Una frase hoy.<br>Un mundo mañana.</h1><p>Escucha, repite y descubre. Aprende inglés con frases que puedes usar de verdad, a tu propio ritmo.</p><button class="primary" id="start">Empezar mi práctica ↗</button> <span class="tag">10 frases · sin prisas</span></div><div class="hero-art" aria-hidden="true"><div class="seed">🌱</div><div class="word">Little by little.</div><small>POCO A POCO, LLEGARÁS LEJOS</small></div></section>${statHTML()}<h2>Tu biblioteca de frases</h2><p class="tag">Toca una frase para escucharla. Intenta comprenderla antes de revelar la traducción.</p>${levels()}<div class="toolbar"><input type="search" id="search" placeholder="Buscar en inglés o español…" aria-label="Buscar frases" value="${esc(search)}"><select id="category" aria-label="Tema"><option value="">Todos los temas</option>${[...new Set(PHRASES.filter(p=>p.level===level).map(p=>p.c))].map(c=>`<option ${category===c?'selected':''}>${c}</option>`).join('')}</select><button class="pill" id="favs" aria-pressed="${onlyFav}">${onlyFav?'★':'☆'} Favoritas</button></div><p class="tag" id="count"></p><div id="results" class="grid"></div><p class="tag">Pronunciación escrita aproximada para hispanohablantes: úsala como apoyo; escucha el audio para los sonidos reales.</p>`;results()}
if(page==='study'){v.innerHTML=`<span class="eyebrow">RECORDAR ES APRENDER</span><h2>Un pequeño paso cada día</h2><p>Escucha la frase, repítela y trata de recordar su significado. Después, evalúate con honestidad.</p>${levels()}<div class="toolbar"><button class="primary" id="newSession">Practicar 10 frases del nivel</button><button class="pill" id="dueSession">Repasar pendientes · todos los niveles</button><button class="pill" id="favSession">Practicar favoritas</button></div><div id="studyArea"></div>`;studyCard()}
if(page==='progress'){let s=stats();v.innerHTML=`<span class="eyebrow">CADA REPASO CUENTA</span><h1>Así crece tu inglés.</h1>${statHTML()}<div class="tips">${names.map((n,i)=>{let a=PHRASES.filter(p=>p.level===i),seen=a.filter(p=>state.cards[p.id]).length,m=a.filter(p=>(state.cards[p.id]?.streak||0)>=3).length;return `<div class="panel"><h2>${n}</h2><div class="bar"><i style="width:${m/30*100}%"></i></div><p>${m} de 30 consolidadas · ${seen} practicadas</p><small>Consolidar = recordar en tres intentos seguidos. Es una autoevaluación, no una certificación de nivel.</small></div>`}).join('')}</div><div class="panel"><h2>Tu actividad reciente</h2>${Object.entries(state.days).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14).map(([d,n])=>`<p>${d} <strong style="float:right">${n} repasos</strong></p>`).join('')||'<p>Tu primera sesión aparecerá aquí.</p>'}</div><div class="toolbar"><button class="pill" id="export">Exportar progreso ↓</button><label class="pill">Importar respaldo <input type="file" id="import" accept="application/json" style="max-width:200px"></label><button class="ghost" id="reset">Borrar progreso</button></div><p class="tag">Los datos pertenecen a este navegador. Borrar sus datos elimina tu progreso si no tienes respaldo.</p>`}
if(page==='guide'){v.innerHTML=`<span class="eyebrow">APRENDE CON INTENCIÓN</span><h1>Tu guía de práctica.</h1><div class="panel"><h2>Haz que suene a ti</h2><div class="settings"><label>Acento <select id="accent"><option value="en-US" ${state.accent==='en-US'?'selected':''}>Estadounidense</option><option value="en-GB" ${state.accent==='en-GB'?'selected':''}>Británico</option></select></label><label>Velocidad <select id="speed">${[.6,.75,.85,1].map(n=>`<option value="${n}" ${Number(state.speed)===n?'selected':''}>${n}×</option>`).join('')}</select></label><label>Voz <select id="voice"><option value="">Automática</option>${voices.filter(x=>x.lang.startsWith(state.accent)).map(x=>`<option value="${esc(x.name)}" ${state.voice===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><button class="pill" data-speak="0">♪ Probar audio</button></div><p class="tag">El audio usa síntesis de voz del navegador. Las voces y acentos disponibles dependen del dispositivo; algunas voces necesitan internet. Si no hay voz del acento elegido, se intenta otra voz en inglés.</p></div><div class="tips">${[
['01 · Escucha antes de leer','Reproduce la frase sin mirar la guía escrita. Busca las palabras que reconoces. Escucha una segunda vez y repite por fragmentos.'],['02 · Repite con ritmo','Imita el acento, las pausas y la entonación. Prueba el shadowing: repite casi al mismo tiempo que la voz. Después dilo sin audio.'],['03 · Recupera el significado','Antes de abrir la traducción, explica con tus palabras qué significa. No necesitas una traducción literal: busca la intención.'],['04 · Crea tu propia frase','Cambia una parte: “I live in Mexico” → “I live in Puebla”. Usa la estructura para hablar de tu vida y di el nuevo ejemplo en voz alta.'],['Fácil · Bloques útiles','Aprende saludos, preguntas y necesidades. “I’m” equivale a “I am”; “I’d like” sirve para pedir amablemente. En preguntas con “do”, el verbo principal no se conjuga.'],['Medio · Conecta tiempos','“I used to” describe hábitos pasados. “I’ve just finished” conecta una acción reciente con el presente. “If it rains, we’ll…” expresa una condición posible.'],['Avanzado · Hipótesis y contexto','“If I were you” da un consejo hipotético. “Should have + participio” expresa lo que habría sido conveniente hacer. Aprende los phrasal verbs completos: “run out of” = quedarse sin.'],['Experto · Registro y matiz','La inversión de “Had I known…” equivale a “If I had known…”. Las expresiones idiomáticas no se traducen palabra por palabra. Este nivel agrupa estructuras complejas; no equivale a una certificación C2.'],['Sonidos que el español no representa','La guía escrita es aproximada, no es AFI. La “h” inglesa es aire suave, no la jota fuerte; “th” no equivale exactamente a “z” o “d”. Para /θ/, como en “thank”, acerca la lengua a los dientes y sopla; para /ð/, como en “this”, añade vibración.'],['Acento y palabras enlazadas','Las tildes de la guía señalan énfasis aproximado. En inglés las palabras se enlazan y muchas vocales se reducen a un sonido suave /ə/. No pronuncies cada sílaba con la misma fuerza.'],['Cómo funcionan los repasos','“Otra vez” vuelve a poner la frase en esta sesión y la programa en 10 minutos. “Con esfuerzo” la programa para mañana y reinicia la racha de aciertos. “La recordé” programa 1, 3, 7, 14 o 30 días según tu racha.'],['Un plan de 10 minutos','Dedica 2 minutos a escuchar, 3 a repetir, 3 a recordar significados y 2 a crear ejemplos. Los favoritos guardan frases importantes. El progreso mide tus autoevaluaciones, no evalúa tu pronunciación.']].map(([h,p])=>`<article class="panel"><h3>${h}</h3><p>${p}</p></article>`).join('')}</div>`}}
function begin(kind='normal'){let a=PHRASES.filter(p=>kind==='due'?state.cards[p.id]&&state.cards[p.id].due<=Date.now():kind==='fav'?state.favorites.includes(p.id):p.level===level);if(kind==='normal')a.sort((a,b)=>(state.cards[a.id]?.due||0)-(state.cards[b.id]?.due||0));else a.sort(()=>Math.random()-.5);queue=a.slice(0,10).map(p=>p.id);pos=0;session=0;revealed=false;studyCard()}
function studyCard(){let el=$('#studyArea');if(!el)return;if(!queue.length){el.innerHTML='<div class="study panel"><div style="font-size:45px">🌱</div><h2>Reserva un momento para ti.</h2><p>Elige un nivel y empieza una práctica, o repasa tus frases pendientes.</p><p class="tag">Si no hay pendientes o favoritas, explora la biblioteca para comenzar.</p></div>';return}if(pos>=queue.length){el.innerHTML=`<div class="study panel"><div style="font-size:45px">🌿</div><h2>¡Práctica completada!</h2><p>Realizaste ${session} repasos. Cada intento ayuda a recordar.</p><button class="primary" id="newSession">Seguir practicando</button></div>`;return}let p=PHRASES[queue[pos]];el.innerHTML=`<section class="study panel"><div class="eyebrow">${names[p.level]} · ${p.c} · ${pos+1} / ${queue.length}</div><div class="bar"><i style="width:${pos/queue.length*100}%"></i></div><button class="speak" lang="en" data-speak="${p.id}">${p.e} ♪</button><p class="phon">${p.p}</p><p class="tag">Repite en voz alta. ¿Recuerdas qué significa?</p>${revealed?`<div class="answer">${p.t}</div><p>¿Cómo te fue al recordar el significado?</p><div class="ratings"><button data-rate="0">Otra vez</button><button data-rate="1">Con esfuerzo</button><button data-rate="2">La recordé ✓</button></div>`:'<button class="primary" id="reveal">Mostrar significado</button>'}</section>`}
function rate(n){let id=queue[pos],old=state.cards[id]||{streak:0,reviews:0};let streak=n===2?old.streak+1:0,delay=n===0?600000:n===1?86400000:[1,3,7,14,30][Math.min(streak-1,4)]*86400000;state.cards[id]={streak,reviews:old.reviews+1,due:Date.now()+delay};state.days[day()]=(state.days[day()]||0)+1;if(n===0)queue.push(id);save();pos++;session++;revealed=false;studyCard()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.level){level=+b.dataset.level;category='';if(page==='study'){queue=[];pos=0}render();return}if(b.dataset.speak!==undefined){speak(+b.dataset.speak);return}if(b.dataset.fav!==undefined){let id=+b.dataset.fav;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();results();return}if(b.dataset.rate!==undefined){rate(+b.dataset.rate);return}switch(b.id){case'start':page='study';render();begin();break;case'newSession':begin();break;case'dueSession':begin('due');break;case'favSession':begin('fav');break;case'reveal':revealed=true;studyCard();break;case'favs':onlyFav=!onlyFav;render();break;case'export':{let url=URL.createObjectURL(new Blob([JSON.stringify({version:1,state},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='phrase-garden-progreso.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case'reset':if(confirm('¿Borrar todo tu progreso y favoritos? Exporta un respaldo antes si deseas conservarlos.')){state.cards={};state.days={};state.favorites=[];queue=[];save();render()}break}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;results()}});document.addEventListener('change',async e=>{let t=e.target;if(t.id==='category'){category=t.value;results()}if(['accent','speed','voice'].includes(t.id)){state[t.id]=t.value;if(t.id==='accent')state.voice='';save();if(t.id==='accent')render()}if(t.id==='import'){try{let d=JSON.parse(await t.files[0].text());let s=d.state;if(d.version!==1||!s||typeof s.cards!=='object'||!Array.isArray(s.favorites)||!s.days||Array.isArray(s.cards))throw Error();let cards={};for(let [k,v]of Object.entries(s.cards)){if(!/^\d+$/.test(k)||!PHRASES[+k]||!Number.isInteger(v.streak)||v.streak<0||!Number.isFinite(v.due)||!Number.isInteger(v.reviews)||v.reviews<0)throw Error();cards[k]={streak:v.streak,due:v.due,reviews:v.reviews}}let days={};for(let[k,v]of Object.entries(s.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Number.isInteger(v)||v<0)throw Error();days[k]=v}if(s.favorites.some(x=>!Number.isInteger(x)||!PHRASES[x]))throw Error();if(confirm('¿Reemplazar tu progreso actual por este respaldo?')){state.cards=cards;state.days=days;state.favorites=[...new Set(s.favorites)];queue=[];save();render();toast('Respaldo importado')}}catch{toast('El archivo no es un respaldo válido de Phrase Garden.')}}});render();

let theme='light',soundEnabled=false,audioContext;
try{theme=localStorage.getItem('pg-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');soundEnabled=localStorage.getItem('pg-sound')==='true'}catch{}
function syncPreferences(){document.documentElement.dataset.theme=theme;const t=document.getElementById('themeToggle'),s=document.getElementById('soundToggle');t.textContent=theme==='dark'?'☀ Claro':'☾ Oscuro';t.setAttribute('aria-label',theme==='dark'?'Activar modo claro':'Activar modo nocturno');s.textContent=soundEnabled?'♪ Sonido activo':'♪ Silenciado';s.setAttribute('aria-pressed',String(soundEnabled));s.setAttribute('aria-label',soundEnabled?'Silenciar efectos de sonido':'Activar efectos de sonido')}
function effect(kind='tap'){if(!soundEnabled)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioContext=audioContext||new C();if(audioContext.state==='suspended')audioContext.resume();const now=audioContext.currentTime;const notes=kind==='success'?[523.25,659.25,783.99]:kind==='retry'?[330,261.63]:[490];notes.forEach((hz,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),t=now+i*.085;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.13)})}catch{}}
document.addEventListener('click',e=>{const b=e.target.closest('button,summary');if(!b)return;if(b.id==='themeToggle'){theme=theme==='dark'?'light':'dark';try{localStorage.setItem('pg-theme',theme)}catch{}syncPreferences();effect();return}if(b.id==='soundToggle'){soundEnabled=!soundEnabled;try{localStorage.setItem('pg-sound',String(soundEnabled))}catch{}syncPreferences();effect();return}if(b.hasAttribute('data-speak'))return;effect(b.dataset.rate==='2'?'success':b.dataset.rate==='0'?'retry':'tap')});syncPreferences();
</script></body></html>
